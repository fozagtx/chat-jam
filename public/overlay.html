<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chat Jam · overlay</title>
    <link rel="stylesheet" href="/overlay.css" />
    <link rel="stylesheet" href="/instrument-art.css" />
  </head>
  <body>
    <main id="stage" aria-label="Chat Jam stream overlay">
      <section class="jam-panel">
        <header class="overlay-header">
          <div class="jam-meta">
            <span id="songInfo">Chat Jam</span>
            <span id="count">0/8</span>
          </div>
          <div
            id="live"
            class="status-dot"
            title="Waiting for Twitch"
            aria-label="Waiting for Twitch"
          >
            <i></i>
          </div>
        </header>

        <div id="notice" class="toast" role="status"></div>

        <section class="band-section" aria-label="The band">
          <div class="section-heading">
            <span>The band</span>
            <span id="leader"></span>
          </div>
          <div id="band"></div>
        </section>

        <section class="now-playing" aria-label="Now playing">
          <div class="section-heading">Now playing</div>
          <div id="grid" aria-label="Sixteen-step song grid"></div>
          <p id="caption">Listening for the first sound…</p>
        </section>
      </section>

      <div id="flash" aria-hidden="true"></div>
      <div id="drop" aria-live="polite">
        <div id="confetti" aria-hidden="true"></div>
        <div class="drop-starburst" aria-hidden="true"></div>
        <div class="drop-art" aria-hidden="true"><span>✳</span></div>
        <div class="burst">THE BUILD</div>
        <div class="credits">
          <span class="made-by">Made by</span>
          <div id="names"></div>
        </div>
      </div>
      <button id="start" class="button button-primary hidden">
        Click to start audio
      </button>
    </main>
    <script type="module" src="/overlay.js"></script>
  </body>
</html>
